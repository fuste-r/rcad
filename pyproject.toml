[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcad"
version = "0.1.0"
description = "A small parametric 3D CAD app: constrained sketches, extrude, push/pull, fillet and chamfer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "build123d",
    "PyOpenGL",
    "numpy",
    "py-slvs",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rcad = "rcad.app:main"

[tool.setuptools]
packages = ["rcad"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
